name: Bug report
description: Report incorrect behavior in the current implementation.
title: "[Bug]: "
labels: []
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is incorrect.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Include the relevant spec or plan section when applicable.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: App/platform version, logs, screenshots, test failure, or other evidence.
    validations:
      required: false
  - type: textarea
    id: regression
    attributes:
      label: Regression check
      description: Did this work previously? If known, identify the commit or PR.
    validations:
      required: false
